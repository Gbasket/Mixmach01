query RunInput {
  shop {
    metafield(namespace: "discount_rules", key: "bundle_rules") {
      value
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          __typename
          id
          product {
            id
          }
        }
      }
    }
  }
}
